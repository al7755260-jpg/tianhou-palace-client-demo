 <dialog id="heritage-dialog"><button class="close" id="close-history" aria-label="关闭海丝记忆"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 5 14 14M19 5 5 19"/></svg></button><span class="eyebrow">QUANZHOU · A PORT OF STORIES</span><h2>潮起刺桐，<br>帆归天后。</h2><p>泉州天后宫始建于南宋庆元二年（1196）。它面向古代商港，也承载着航海者祈求平安、商旅寄托乡思的愿望。</p><p>从山门、戏台、拜庭，到天后殿、寝殿与梳妆楼，建筑沿中轴层层展开。海上贸易带来的交流，与闽南的信仰、工艺和日常生活，在这里相遇。</p><a href="https://www.quanzhou.gov.cn/lyb/lswh/zdww/qgzdwwbhdwjj/202311/t20231130_2974354.htm" target="_blank" rel="noopener noreferrer">资料来源 · 泉州市人民政府 ↗</a></dialog>
